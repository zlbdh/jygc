mcps:
  - name: db-schema-readonly
    status: blueprint
    environment: dev-or-test
    access: readonly
    owner_scope: example-org
    snapshot_required: true
    source_stamp_required: true
    exposes:
      resources:
        - schema
        - tables
        - indexes
      tools:
        - describe_table
        - list_tables
    notes:
      - "Only read table structures and indexes in development or test environments."
  - name: api-contract-readonly
    status: blueprint
    environment: dev-or-test
    access: readonly
    owner_scope: example-org
    snapshot_required: true
    source_stamp_required: true
    exposes:
      resources:
        - openapi
        - postman
        - json-schema
        - samples
      tools:
        - get_endpoint_contract
        - list_contracts
    notes:
      - "Provide a shared view of API contracts, examples, and version information."
  - name: config-readonly
    status: blueprint
    environment: dev-or-test
    access: readonly
    owner_scope: example-org
    snapshot_required: true
    source_stamp_required: true
    exposes:
      resources:
        - env-mapping
        - nacos-config
      tools:
        - get_config_key
        - list_config_groups
    notes:
      - "Inspect configuration mappings through read-only access. Do not modify or publish configuration."
  - name: observability-readonly
    status: blueprint
    environment: dev-or-test
    access: readonly
    owner_scope: example-org
    snapshot_required: true
    source_stamp_required: true
    exposes:
      resources:
        - logs
        - traces
        - error-summary
      tools:
        - search_logs
        - get_trace
        - list_recent_errors
    notes:
      - "Read logs, traces, and error summaries in development or test environments only."
