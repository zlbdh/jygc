repos:
  - id: backend
    name: example-product-backend
    remote: "https://example.com/example-org/example-product-backend.git"
    local_path: "D:\\workspace\\agent-harness\\repos\\example-product-backend"
    default_branch: master
    stack: java-spring-cloud
    role: backend-service
    clone_mode: git
    validation_profile: backend-maven
    owner_scope: example-org
    bootstrap_command: "mvn -version"
    build_command: "mvn -pl services/example-service -am package -DskipTests"
    test_command: "mvn -pl services/example-service -am test"
    smoke_command: "mvn -pl services/example-service -am -Dtest=*Test test"
    safe_check_commands:
      - "mvn -q -pl services/example-service -am -DskipTests validate"
      - "mvn -q -pl services/example-service -am test"
      - "mvn -q -pl services/example-service -am -DskipTests package"
    status: baseline-ready
    notes: "Baseline commands come from an existing backend deployment copy. Before execution, clone the repository to local_path and adjust module parameters for the target microservice."
  - id: web-portal
    name: example-product-web-portal
    remote: "https://example.com/example-org/example-product-web-portal.git"
    local_path: "D:\\workspace\\agent-harness\\repos\\example-product-web-portal"
    default_branch: master
    stack: vue-vite
    role: enterprise-web
    clone_mode: git
    validation_profile: web-vite
    owner_scope: example-org
    bootstrap_command: "npm ci --ignore-scripts"
    build_command: "npm run build:prod"
    test_command: "npm run build:prod"
    smoke_command: "npx playwright test"
    safe_check_commands:
      - "npm run build:prod"
      - "npm run build:stage"
    status: baseline-ready
    notes: "The currently known minimum command contract is build; lint/typecheck will be added later."
  - id: admin-web
    name: example-product-admin-web
    remote: "https://example.com/example-org/example-product-admin-web.git"
