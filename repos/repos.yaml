    default_branch: master
    stack: vue-vite
    role: platform-web
    clone_mode: git
    validation_profile: web-vite
    owner_scope: example-org
    bootstrap_command: "npm ci --ignore-scripts"
    build_command: "npm run build:prod"
    test_command: "npm run build:stage"
    smoke_command: "npx playwright test"
    safe_check_commands:
      - "npm run build:prod"
      - "npm run build:stage"
    status: baseline-ready
    notes: "The platform administration portal has confirmed standard Vue/Vite build scripts and can be included in the local baseline."
  - id: mobile-a
    name: example-product-mobile-a
    remote: "https://example.com/example-org/example-product-mobile-a.git"
    local_path: "D:\\workspace\\agent-harness\\repos\\example-product-mobile-a"
    default_branch: main
    stack: react-native-typescript
    role: enterprise-mobile
    clone_mode: git
    validation_profile: mobile-rn
    owner_scope: example-org
    bootstrap_command: "npm ci --ignore-scripts"
    build_command: "npm run start"
    test_command: "npm run test -- --watch=false"
    smoke_command: "maestro test .\\evals\\mobile"
    safe_check_commands:
      - "npm run lint"
      - "npx expo --version"
    status: baseline-ready
    notes: "At this local stage, the enterprise app enters the main baseline through lint and Expo environment checks. Jest contract tests still have pre-existing API-path and test-configuration issues, reserved for the next remediation cycle."
